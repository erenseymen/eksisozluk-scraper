<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Terminal window decoration -->
  <rect x="100" y="150" width="1000" height="380" rx="8" fill="#0f1419" stroke="#00d4ff" stroke-width="2" opacity="0.9"/>
  
  <!-- Terminal header -->
  <rect x="100" y="150" width="1000" height="40" rx="8" fill="#1e2329"/>
  <circle cx="120" cy="170" r="6" fill="#ff5f57"/>
  <circle cx="140" cy="170" r="6" fill="#ffbd2e"/>
  <circle cx="160" cy="170" r="6" fill="#28ca42"/>
  
  <!-- Terminal prompt -->
  <text x="120" y="240" font-family="'Courier New', monospace" font-size="24" fill="#00d4ff">
    $ eksisozluk-scraper "başlık"
  </text>
  
  <!-- Scraping indicator -->
  <text x="120" y="290" font-family="'Courier New', monospace" font-size="18" fill="#a0a0a0">
    Scraping entries...
  </text>
  
  <!-- Output formats -->
  <text x="120" y="340" font-family="'Courier New', monospace" font-size="16" fill="#28ca42">
    ✓ JSON  ✓ CSV  ✓ Markdown
  </text>
  
  <!-- Main title -->
  <text x="600" y="100" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">
    eksisozluk-scraper
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="140" font-family="Arial, sans-serif" font-size="28" fill="#00d4ff" text-anchor="middle">
    Terminal-based Ekşi Sözlük Scraper
  </text>
  
  <!-- Features list -->
  <g transform="translate(600, 480)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">
      CLI Interface • AI-Friendly Output • Multiple Formats
    </text>
  </g>
  
  <!-- Decorative elements - code brackets -->
  <text x="80" y="320" font-family="monospace" font-size="120" fill="#00d4ff" opacity="0.1">{</text>
  <text x="1120" y="320" font-family="monospace" font-size="120" fill="#00d4ff" opacity="0.1">}</text>
  
  <!-- GitHub username -->
  <text x="600" y="600" font-family="Arial, sans-serif" font-size="18" fill="#888888" text-anchor="middle">
    github.com/erenseymen/eksisozluk-scraper
  </text>
</svg>
